[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gh-review-insight"
version = "0.1.0"
description = "GitHub review requests and review activity from the terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Core + CLI deliberately have no third-party dependencies; transport is
# delegated to the `gh` CLI at runtime.
dependencies = []

[project.optional-dependencies]
# The interactive TUI. Install with: pip install 'gh-review-insight[tui]'
tui = ["textual>=0.60"]

[project.scripts]
gh-review-insight = "gh_review_insight.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["gh_review_insight"]
